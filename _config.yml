title: Librescoot
description: Open-source firmware for the unu Scooter Pro
url: https://librescoot.org
baseurl: ""

# Current stable docs path. Top-nav and landing-page docs links use this so
# clicks resolve directly to the right minor (no redirect bounce through
# /docs/stable/). Bump on each minor release.
docs_path_prefix: "/docs/1.3"

# Fail the build on a malformed tag, an unknown filter or unparseable front
# matter. Jekyll's default is lax: a typo'd filter renders as empty output, so
# on a hand-written HTML docs site the page ships looking subtly wrong.
#
# strict_variables stays off. Optional page variables like extra_head are used
# throughout and would each need a default filter before it could be enabled.
strict_front_matter: true
liquid:
  error_mode: strict
  strict_filters: true

# News collection. One post is two files, _news/de/<slug>.md and
# _news/en/<slug>.md, both carrying the same explicit
# `permalink: /news/<slug>/`. Polyglot keys its duplicate detection on that
# permalink and keeps the file whose `lang` matches the language being built,
# so the pair collapses to one page per language tree. The permalink has to be
# spelled out: polyglot rewrites a document's permalink to strip the language,
# but Jekyll has already memoised the URL by then, so a derived one would keep
# the /de/ or /en/ segment in the output path.
#
# A post that exists in only one language still renders under both, showing the
# original text plus the "not translated yet" notice the nav include emits.
#
# Front matter of a post: lang, title, date, permalink, summary, and optionally
# image + image_alt (a card with no image gets a placeholder tile instead) or
# icon to pick the lucide glyph on that tile. The layout comes from the
# defaults below.
collections:
  news:
    output: true
    permalink: /news/:path/

defaults:
  - scope:
      path: ""
      type: "news"
    values:
      layout: "news"

plugins:
  - jekyll-polyglot
  - jekyll-redirect-from

languages: ["de", "en"]
default_lang: "de"
exclude_from_localization: ["images", "fonts", "js", "style.css", ".github", "CNAME"]
# Must stay off. Polyglot's parallel mode forks a process per language, and a
# Liquid exception in a forked child never reaches the parent's exit status:
# the build prints the error in red and exits 0. That makes the strict
# settings above inert in CI, so a page with a broken template deploys with a
# hole in it and the run still passes. Sequential costs ~1.5s on a ~3s build
# and produces byte-identical output.
parallel_localization: false
lang_from_path: false

exclude:
  - NEWS-STYLE.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - .ruby-lsp/
  - .playwright-mcp/
  - .claude/
  - vendor/
