<!DOCTYPE html>
<html lang="{{ site.active_lang | default: site.default_lang | default: 'en' }}">
<head>
    {% include head.html %}
    <script src="/js/lottie.min.js"></script>
</head>
<body>
    {{ content }}

    {% include footer.html %}

    <script>
        // Mobile navigation. First in the block: everything below it is
        // page decoration, and a throw there must not take the nav with it.
        {% include nav.js %}

        lucide.createIcons();

        // Theme toggle
        {% include theme-toggle.js %}

        // Boot animation
        var lowerDot = document.getElementById('dbc-dot-lower');
        var bootLogo = document.getElementById('boot-logo');
        var bootAnimEl = document.getElementById('boot-animation');

        var anim = lottie.loadAnimation({
            container: bootAnimEl,
            renderer: 'svg',
            loop: false,
            autoplay: false,
            path: '/images/boot-animation.json'
        });

        setTimeout(function() {
            lowerDot.classList.add('dbc-dot-green');
        }, 500);

        setTimeout(function() {
            lowerDot.classList.remove('dbc-dot-green');
            bootLogo.style.opacity = '1';
        }, 1250);

        setTimeout(function() {
            bootAnimEl.style.opacity = '1';
            anim.play();
        }, 2750);

        // Screenshot carousel — starts after boot animation
        var carousel = document.getElementById('screenshot-carousel');
        var slides = document.querySelectorAll('.screenshot-slide');
        var currentSlide = 0;

        anim.addEventListener('complete', function() {
            setTimeout(function() {
                bootAnimEl.style.opacity = '0';
                bootLogo.style.opacity = '0';
                carousel.classList.add('active');
                setInterval(function() {
                    slides[currentSlide].classList.remove('active');
                    currentSlide = (currentSlide + 1) % slides.length;
                    slides[currentSlide].classList.add('active');
                }, 4000);
            }, 1500);
        });

        var testimonialGallery = document.querySelector('[data-testimonial-gallery]');
        if (testimonialGallery) {
            var testimonialList = testimonialGallery.querySelector('.testimonials');
            var testimonialButtons = testimonialGallery.querySelectorAll('[data-testimonial-direction]');

            function updateTestimonialGallery() {
                var maxScroll = testimonialList.scrollWidth - testimonialList.clientWidth;
                var atStart = testimonialList.scrollLeft <= 1;
                var atEnd = testimonialList.scrollLeft >= maxScroll - 1;
                testimonialGallery.classList.toggle('is-at-start', atStart);
                testimonialGallery.classList.toggle('is-at-end', atEnd);
            }

            function shuffleTestimonials() {
                var cards = Array.prototype.slice.call(testimonialList.children);
                var today = new Date();
                var yearStart = new Date(today.getFullYear(), 0, 0);
                var dayOfYear = Math.floor((today - yearStart) / 86400000);
                var state = dayOfYear;

                function random() {
                    state = (state * 1664525 + 1013904223) % 4294967296;
                    return state / 4294967296;
                }

                for (var i = cards.length - 1; i > 0; i--) {
                    var j = Math.floor(random() * (i + 1));
                    var card = cards[i];
                    cards[i] = cards[j];
                    cards[j] = card;
                }

                cards.forEach(function(card) {
                    testimonialList.appendChild(card);
                });
            }

            shuffleTestimonials();

            testimonialButtons.forEach(function(button) {
                button.addEventListener('click', function() {
                    var direction = Number(button.dataset.testimonialDirection);
                    var maxScroll = testimonialList.scrollWidth - testimonialList.clientWidth;

                    if (direction < 0 && testimonialList.scrollLeft <= 1) {
                        testimonialList.scrollTo({ left: maxScroll, behavior: 'auto' });
                    } else if (direction > 0 && testimonialList.scrollLeft >= maxScroll - 1) {
                        testimonialList.scrollTo({ left: 0, behavior: 'auto' });
                    } else {
                        testimonialList.scrollBy({
                            left: direction * testimonialList.clientWidth * 0.8,
                            behavior: 'smooth'
                        });
                    }
                });
            });

            testimonialList.addEventListener('scroll', updateTestimonialGallery);
            window.addEventListener('resize', updateTestimonialGallery);
            updateTestimonialGallery();
        }
    </script>
</body>
</html>
