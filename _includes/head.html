<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }}{% unless page.title contains "Librescoot" %} - Librescoot{% endunless %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/images/og-image.png' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/style.css">
<script src="/js/lucide.min.js"></script>
<script>
(function() {
    var t = localStorage.getItem('theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
})();
</script>
{% if page.translation_url %}
<meta http-equiv="Content-Language" content="{{ site.active_lang }}">
{% if site.active_lang == "de" %}
<link rel="alternate" hreflang="de" href="{{ site.url }}{{ page.url }}"/>
<link rel="alternate" hreflang="en" href="{{ site.url }}/en{{ page.translation_url }}"/>
{% else %}
<link rel="alternate" hreflang="de" href="{{ site.url }}{{ page.translation_url }}"/>
<link rel="alternate" hreflang="en" href="{{ site.url }}/en{{ page.url }}"/>
{% endif %}
{% else %}
{% i18n_headers %}
{% endif %}
{% if page.extra_head %}{{ page.extra_head }}{% endif %}
