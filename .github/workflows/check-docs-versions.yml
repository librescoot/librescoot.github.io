name: Check docs versions

# Fires the same check as the deploy workflow, but on a daily schedule so a
# new firmware release (which lands on librescoot/librescoot, not here)
# triggers a failure here within 24h instead of waiting for the next docs push.
#
# A failed scheduled run reaches no inbox on its own: GitHub notifies the
# triggering actor and a cron has none. It calls notify-failure.yml instead.
# Fix by running scripts/release-new-minor.sh <minor> to seed the missing docs
# folder, or by re-running the workflow once the release was a mistake.

on:
  schedule:
    - cron: '17 6 * * *'  # 06:17 UTC daily — off-the-hour to avoid the cron stampede
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # notify-failure.yml files the tracking issue

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs versions cover released firmware
        run: .github/check-docs-versions.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: check
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      what: A released firmware minor has no docs
    secrets:
      discord_webhook: ${{ secrets.DISCORD_WEBHOOK }}
